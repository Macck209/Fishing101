plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url 'https://maven.nucleoid.xyz' }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "fishing101" {
            sourceSet sourceSets.main
        }
    }

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation include("xyz.nucleoid:server-translations-api:${project.server_translations_version}")
	implementation include("eu.pb4:polymer-core:${project.polymer_version}")
	implementation include("eu.pb4:polymer-resource-pack:${project.polymer_version}")
	implementation include("eu.pb4:sgui:${project.sgui_version}")

	// Dev server only: serves the resource pack to a joining client.
	localRuntime "eu.pb4:polymer-autohost:${project.polymer_version}"
}

processResources {
	def props = [
		version: project.version,
		loader_version: project.loader_version,
		minecraft_version: project.minecraft_version,
		java_version: project.java_version
	]
	inputs.properties props

	filesMatching(["fabric.mod.json", "${project.mod_id}.mixins.json".toString()]) {
		expand props
	}

	// server-translations reads data/<ns>/lang, so clients without the pack get names too.
	from("src/main/resources/assets/${project.mod_id}/lang") {
		into "data/${project.mod_id}/lang"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as int
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(project.java_version as int)
	}
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
